services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26.0}
    container_name: graphiti-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
    volumes:
      - graphiti_neo4j_data:/data
    security_opt:
      - apparmor:unconfined
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: graphiti-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - graphiti_redis_data:/data
    security_opt:
      - apparmor:unconfined

  adapter:
    build:
      context: ./backend/adapter
    container_name: graphiti-adapter
    restart: always
    ports:
      - "${ADAPTER_PORT:-8000}:8000"
    environment:
      # Increase concurrent LLM operations for faster processing
      # Default is ~10, we set to 20 to balance speed and rate limits
      - SEMAPHORE_LIMIT=20
    env_file:
      - .env.adapter
    security_opt:
      - apparmor:unconfined
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: graphiti-worker
    restart: always
    env_file:
      - .env.worker
    security_opt:
      - apparmor:unconfined
    depends_on:
      - redis
      - adapter

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: graphiti-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    env_file:
      - ./frontend/.env
    security_opt:
      - apparmor:unconfined
    depends_on:
      - adapter

volumes:
  graphiti_neo4j_data:
  graphiti_redis_data:
